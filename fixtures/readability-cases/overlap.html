<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>readability-case: overlap (RED)</title>
<!-- 假页 R2：两条正文级文本同排硬重叠（同一基线，水平区间互相覆盖）。
     可读性闸的包围盒相交检测必须判红。 -->
<style>html,body{margin:0;background:#0e0e0d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { createSegment } from '/templates/common.js';

const W = 1920, H = 1080;
const p = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment({ duration: 3 });
window.DURATION = seg.duration;

window.renderFrame = (u) => {
  seg.sample(u);
  ctx.fillStyle = '#0e0e0d';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = '700 64px sans-serif';
  ctx.fillStyle = '#f5f0e8';
  // 同一行：第二条的水平起点落在第一条的水平区间内 → 大面积相交。
  ctx.fillText('甲文案行一', W * 0.18, H * 0.5);
  ctx.fillText('乙文案压上', W * 0.24, H * 0.5);
};

window.__ready = false;
window.renderFrame(0);
window.__ready = true;
</script>
</body>
</html>
