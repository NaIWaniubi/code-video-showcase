<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>readability-case: short-dwell (RED)</title>
<!-- 假页 R3：一条超过 8 码点的长文案只在 u < 0.4s 出现。
     停留聚合后约 0.5s，远低于 max(1.8s, speech+0.6s) → 可读性闸判红。
     ?dur= 由测试 plan 的段时长驱动（与渲染器同参数面）。 -->
<style>html,body{margin:0;background:#0e0e0d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { createSegment } from '/templates/common.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment({ duration: 3 });
window.DURATION = seg.duration;

const LONG = '这是一条超过八个码点的可读性回归文案';

window.renderFrame = (u) => {
  seg.sample(u);
  ctx.fillStyle = '#0e0e0d';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (u < 0.4) {
    ctx.font = '700 56px sans-serif';
    ctx.fillStyle = '#f5f0e8';
    ctx.fillText(LONG, W / 2, H / 2);
  } else {
    // 短停之后只剩角标级小字（caption 级不进口径）——模拟「长文案一闪而过」。
    ctx.font = '400 22px sans-serif';
    ctx.fillStyle = '#8a857c';
    ctx.fillText('完', W / 2, H / 2);
  }
};

window.__ready = false;
window.renderFrame(0);
window.__ready = true;
</script>
</body>
</html>
