<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>readability-case: full-dwell (GREEN)</title>
<!-- 假页 R3 对照：与 short-dwell 同款长文案，全段停留（plan 段时长 5s）。
     5s ≥ max(1.8, speech≈4.25+0.6) → 闸必须绿。 -->
<style>html,body{margin:0;background:#0e0e0d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { createSegment } from '/templates/common.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment({ duration: 3 });
window.DURATION = seg.duration;

const LONG = '这是一条超过八个码点的可读性回归文案';

window.renderFrame = (u) => {
  seg.sample(u);
  ctx.fillStyle = '#0e0e0d';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 56px sans-serif';
  ctx.fillStyle = '#f5f0e8';
  ctx.fillText(LONG, W / 2, H / 2);
};

window.__ready = false;
window.renderFrame(0);
window.__ready = true;
</script>
</body>
</html>
