<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>recipe · firework</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e0e0d; }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script type="module">
// recipe-firework.html — 「粒子喷泉」：每个粒子一条闭式弹道——
//   p(t) = base + v·φ − ½g·φ²，φ = (t − t_launch) mod (飞行+暂停)
// 无积分、无状态：同一 t 永远同一画面；轨迹尾迹按 φ−δ 的闭式求值画出来。
import { createSegment, applyImpact2D, drawFlash, loadFonts, vars, TAU, clamp, hash01, cachedGradient } from './common.js';
import {
  themeFromURL, getTheme, loadFontsFor, hexToRgba, mix, relativeLuminance,
} from './themes.js';
import { setupStage, safePad, fitTextSize, drawHud } from './recipes/util.js';
import { typeSize, safe, probe } from './tokens.mjs';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const { W, H, portrait } = setupStage(canvas);
const pad = safePad(W, H);

const params = new URLSearchParams(location.search);
const seg = createSegment({ duration: 3.0 });
window.DURATION = seg.duration;

const THEME = getTheme(themeFromURL(location.search));
const TC = THEME.colors;
const V = vars();

const TITLE = String(params.get('title') || V.title || '粒子喷泉').slice(0, 14);
const SUB = String(V.subtitle || '闭式弹道 · 循环发射 · 尾迹彗尾').slice(0, 40);
const BRAND = String(V.brand || 'CVS').slice(0, 24);

const isLight = THEME.mode === 'light' || relativeLuminance(TC.bg) > 0.55;
const INK = isLight ? TC.ink : TC.paper;
const MUTED = hexToRgba(INK, 0.45);
const ACCENT = TC.accent;
const PAPER = isLight ? TC.paperInk || TC.ink : TC.paper;

const SANS = '"Noto Sans SC", "PingFang SC", sans-serif';
const FAMILIES = Array.from(new Set([...(loadFontsFor(THEME) || []), 'Noto Sans SC', 'Inter']));

/* ───────────────────────────── 布局 ───────────────────────────── */

let L = null;
function buildLayout() {
  const baseX = portrait ? Math.round(W / 2) : Math.round(W * 0.30);
  const baseY = Math.round(H * 0.88);
  const scale = Math.min(W, H) * (portrait ? 0.20 : 0.26);
  const titleMaxW = portrait ? W - pad * 2 : W - Math.round(W * 0.62) - pad;
  const titleSize = fitTextSize(ctx, TITLE, {
    maxWidth: titleMaxW, family: SANS, weight: 800,
    maxSize: typeSize('title', W, H), minSize: 40, spacing: 0.02,
  });
  probe('title', titleSize, safe(W, H));
  return { baseX, baseY, scale, titleSize,
    titleX: portrait ? Math.round(W / 2) : Math.round(W * 0.62),
    titleY: Math.round(H * 0.16),
    subX: portrait ? Math.round(W / 2) : Math.round(W * 0.62), subY: 0 };
}

/* ────────────────── 弹道参数（种子化，闭式） ──────────────── */

const G = 9.8 * 0.55;                  // 重力（单位/秒²，像素尺度用 scale 缩放）
const N_PARTICLES = 150;
function particleI(i, seedHash) {
  const rnd = (k) => hash01(i * 2654435761 ^ (k * 40503) ^ seedHash, k);
  return {
    // 初速（像素/s，按 scale 归一）
    vx: (rnd(1) - 0.5) * 260 * (rnd(2) * 0.6 + 0.7),
    vy: -(220 + rnd(3) * 420),
    // 生命周期参数
    flightT: 1.35 + rnd(4) * 0.7,
    pauseT: 0.9 + rnd(5) * 1.6,
    launchT: rnd(6) * seg.duration * 0.55,   // 错峰发射时刻
    warm: rnd(7) > 0.72,                    // 暖色粒比例
    size: 1.8 + rnd(8) * 2.4,
    spin: (rnd(9) - 0.5) * 10,
  };
}

/** 粒子在时间 t 的相位 φ 与高度/横坐标。 */
function ballistic(pt, t, s) {
  const el = t - pt.launchT;
  if (el < 0) return null;                    // 未发射
  const period = pt.flightT + pt.pauseT;
  const phi = el % period;
  const x = pt.vx * phi * s / 100;
  const y = (pt.vy * phi + 0.5 * G * phi * phi) * s / 100;
  return { x, y, phi, flightT: pt.flightT, period, apexPhi: pt.vy / -G, ...pt, vy_: pt.vy };
}

/* ────────────────────────── 场景 ────────────────────────────── */

function drawScene(u, t) {
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  let h = 2166136261;
  for (let i = 0; i < BRAND.length; i++) h = Math.imul(h ^ BRAND.charCodeAt(i), 16777619);
  const SEED = (h >>> 0) % 100000;

  // 底座光柱（缓变缓存一次，运行时只画矩形渐变）
  const gradKey = `fw-base-${SEED}`;
  ctx.save();
  ctx.globalAlpha = 0.30;
  const baseGrad = cachedGradient(ctx, gradKey, () => {
    const g = ctx.createLinearGradient(L.baseX, L.baseY - L.scale * 0.9, L.baseX, L.baseY);
    g.addColorStop(0, hexToRgba(ACCENT, 0));
    g.addColorStop(1, hexToRgba(ACCENT, 0.85));
    return g;
  });
  ctx.fillStyle = baseGrad;
  ctx.fillRect(L.baseX - L.scale * 0.045, L.baseY - L.scale * 0.95, L.scale * 0.09, L.scale * 0.95);
  ctx.restore();

  // 底座圆盘 + 脉冲环
  ctx.save();
  ctx.strokeStyle = hexToRgba(INK, 0.45);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(L.baseX, L.baseY, L.scale * 0.05, L.scale * 0.02, 0, 0, TAU);
  ctx.stroke();
  const pulseR = (t * 0.5) % 1;
  ctx.strokeStyle = hexToRgba(ACCENT, 0.45 * (1 - pulseR));
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(L.baseX, L.baseY, L.scale * (0.05 + pulseR * 0.12), 0, TAU);
  ctx.stroke();
  ctx.restore();

  // 粒子层
  for (let i = 0; i < N_PARTICLES; i++) {
    const raw = particleI(i, SEED);
    const p = ballistic(raw, t, L.scale);
    if (!p) continue;
    const bx = L.baseX + p.x;
    const by = L.baseY + p.y;
    if (by > L.baseY + 4) continue;
    // 循环内透明度（起落淡入淡出）
    const lifeFrac = p.phi / p.period;
    const alpha = 0.22 + 0.78 * Math.sin(Math.PI * Math.min(1, lifeFrac));
    const color = p.warm ? hexToRgba(mix(ACCENT, PAPER, 0.35), alpha)
      : hexToRgba(PAPER, alpha);
    // 尾迹：三个历史位置的彗尾（闭式 φ−δ）
    for (let dk = 1; dk <= 3; dk++) {
      const phiD = p.phi - dk * 0.03;
      if (phiD <= 0) continue;
      const tx = p.vx * phiD * L.scale / 100;
      const ty = (p.vy * phiD + 0.5 * G * phiD * phiD) * L.scale / 100;
      ctx.globalAlpha = alpha * (1 - dk * 0.26);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(L.baseX + tx, L.baseY + ty, p.size * (1 - dk * 0.18), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(bx, by, p.size, 0, TAU);
    ctx.fill();
    // 过顶后的爆发环（一次性扩张，如实按 φ−apex 画）
    if (p.phi > p.apexPhi && p.phi - p.apexPhi < 0.22) {
      const rr = (p.phi - p.apexPhi) * L.scale * 0.32;
      ctx.globalAlpha = alpha * 0.4;
      ctx.strokeStyle = hexToRgba(ACCENT, 0.6);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(bx, by, rr, 0, TAU);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // 标题色带（上置，避开喷泉区）
  const fade = smoothstepX(clamp(t / 0.55));
  if (fade > 0.001) {
    ctx.save();
    ctx.globalAlpha = fade;
    const bandH = Math.round(L.titleSize * 1.7);
    const bandW = Math.min(portrait ? W - pad * 2 : W * 0.36, L.titleSize * 9);
    const bandX = portrait ? Math.round((W - bandW) / 2) : Math.round(W * 0.62 - bandW / 2);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(bandX, L.titleY - bandH / 2, bandW, bandH);
    ctx.fillStyle = isLight ? TC.paper : TC.bg;
    ctx.font = `800 ${L.titleSize}px ${SANS}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(TITLE, bandX + bandW / 2, L.titleY + 1);
    ctx.restore();
  }
  const subFade = smoothstepX(clamp((t - 0.4) / 0.5));
  if (subFade > 0.001 && SUB) {
    ctx.save();
    ctx.globalAlpha = subFade * 0.9;
    ctx.font = `${Math.max(13, L.titleSize * 0.26)}px ${SANS}`;
    ctx.fillStyle = MUTED;
    ctx.textAlign = portrait ? 'center' : 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(SUB, L.subX, L.titleY + Math.round(L.titleSize * 1.7));
    ctx.restore();
  }

  try {
    drawHud(ctx, { W, H, u, duration: seg.duration, theme: THEME,
      label: 'DEMO FOUNTAIN', name: 'PARTICLES', brand: BRAND, pad });
  } catch { /* HUD 不参与核心画面 */ }
}

function smoothstepX(a) { const x = Math.min(1, Math.max(0, a)); return x * x * (3 - 2 * x); }

window.renderFrame = (u) => {
  const { t, fx } = seg.sample(u);
  ctx.save();
  ctx.scale(1 + (fx.scale - 1), 1 + (fx.scale - 1));
  drawScene(u, t);
  ctx.restore();
  applyImpact2D(ctx, fx, W, H);
  drawFlash(ctx, fx.flash, W, H, TC.paper);
};

window.__ready = false;
window.__bootError = null;
(async () => {
  try {
    await loadFonts(FAMILIES);
    L = buildLayout();
    window.renderFrame(0);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String((e && e.stack) || e);
  }
})();
</script>
</body>
</html>
