name: compiler

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 首跑 CI 实测：runner 无 numpy/scipy → qa-audio 相关 contract 断言 5 红。
      - name: Install python numerics (qa-audio.py)
        run: sudo apt-get install -y python3-numpy python3-scipy

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Shell scripts parse (R3/RT-09 F9 — install.sh 等无语法门禁曾被 CRLF/引用坑过)
        run: |
          for f in install.sh arm.sh templates/concat-and-encode.sh; do
            bash -n "$f" || exit 1
            echo "$f BASH_N_OK"
          done

      - name: Error-code registry
        run: node scripts/errors.mjs --check

      - name: Font lock present and consistent
        run: node -e "const fs=require('fs');const l=JSON.parse(fs.readFileSync('shared/fonts.lock.json','utf8'));if(!l.count||!l.setSha256)process.exit(1);console.log('fonts:',l.count,'set',l.setSha256.slice(0,12))"

      - name: Pure-Node test suites (machine-readable)
        env:
          # UNIT 组现含 test-render-perf --quick（真渲染，G1-3）；GitHub ubuntu
          # 运行器自带 google-chrome。其余套件不依赖它。
          CHROME_EXE: google-chrome
        run: |
          set -o pipefail  # G1-1：GitHub bash 默认 `-e` 无 pipefail，`cmd | tee` 会吃 cmd 的退出码（假绿）
          mkdir -p out
          node scripts/test-all.mjs --json | tee out/test-all.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-all-report
          path: out/test-all.json
          if-no-files-found: ignore

      - name: Spec gates (pages / theme / APCA)
        run: node scripts/spec-lint.mjs --spec fixtures/mini-41s/spec.json --root .

      - name: Plan compiler
        run: node templates/plan.mjs --spec fixtures/mini-41s/spec.json --root . --check

      # G1-6：`npm run gate` 进 CI 的静帧档（errors --check + build-combos --check
      # + lint + plan --check + determinism-check 不带 --video）。视频档 determinism
      # 留在 nightly（G1-5），避免每次 push 跑整段重编。
      - name: Gate (static-frame tier)
        env:
          CHROME_EXE: google-chrome
        run: |
          set -o pipefail
          npm run gate

      - name: CLI smoke
        run: |
          node bin/cvs.mjs new "赛博像素的宣传片，30秒竖屏" --out out/ci.spec.json
          node bin/cvs.mjs lint out/ci.spec.json --root .
          node bin/cvs.mjs plan out/ci.spec.json --root . --check

      - name: Motion profile smoke
        run: |
          node bin/cvs.mjs motion list
          node bin/cvs.mjs motion derive --kind promo --style cyber-pixel
          node bin/cvs.mjs motion matrix

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build local fonts
        run: node scripts/build-fonts.mjs

      # Same machine, two passes: proves frames are reproducible here.
      # Cross-machine hashes in fixtures/golden/manifest.json are font/Chrome
      # dependent, so CI checks self-consistency instead of the committed hashes.
      - name: Golden self-check
        env:
          CHROME_EXE: google-chrome
        run: node scripts/golden.mjs --selfcheck

  windows-static:
    # 跨平台契约：Windows 路径 / CRLF / 反斜杠不能只在作者机器上成立。
    # 不渲染，只跑纯模块与 spec 闸门。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: install.ps1 parses (R2-08 — v2.4 shipped with every $ stripped)
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'install.ps1 PARSE_OK'

      - name: Pure-Node tests
        run: node scripts/test-core.mjs

      - name: Compiler contract
        run: node scripts/test-compiler-contract.mjs

      - name: Versioning contract
        run: node scripts/test-versioning.mjs

      - name: Type tokens (static half)
        run: node scripts/test-type-tokens.mjs

      - name: Spec gates
        run: node scripts/spec-lint.mjs --spec fixtures/mini-41s/spec.json --root .

      - name: Plan gates
        run: node bin/cvs.mjs plan fixtures/mini-41s/spec.json --root . --check

